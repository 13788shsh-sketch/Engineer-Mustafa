<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام إدارة الأعمال</title><style>body{margin:0;font-family:Arial;background:#203244;color:#17202a}.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.card{width:85%;max-width:560px;background:white;border-radius:28px;padding:40px;box-shadow:0 15px 50px #0005}h1{text-align:center}.sub{text-align:center;color:#777;font-size:20px;margin-bottom:25px}input{width:100%;box-sizing:border-box;padding:17px;margin:8px 0;border-radius:15px;border:1px solid #ddd;background:#fffed0;font-size:18px}button{width:100%;padding:17px;border:0;border-radius:14px;background:#287dab;color:white;font-size:18px;margin-top:15px}#error{text-align:center;color:#c62828;margin-top:12px;min-height:22px}#app{display:none;min-height:100vh;background:#f4f7fa}header{background:#1f3447;color:white;padding:18px 25px;display:flex;justify-content:space-between}header button{width:auto;background:#c0392b;margin:0;padding:10px 18px}.content{padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.box{background:white;border-radius:18px;padding:25px;box-shadow:0 3px 15px #0001}.num{font-size:30px;color:#287dab;font-weight:bold}</style></head><body><div class="login" id="login"><div class="card"><h1>نظام إدارة الأعمال</h1><div class="sub">تسجيل الدخول</div><form onsubmit="return doLogin()"><input id="username" type="text" placeholder="اسم المستخدم" required><input id="password" type="password" placeholder="رمز الدخول" required><button type="submit">دخول</button><div id="error"></div></form></div></div><div id="app"><header><h2>لوحة إدارة الأعمال</h2><button onclick="doLogout()">خروج</button></header><div class="content"><h2 id="welcome"></h2><div class="grid"><div class="box"><h3>العملاء</h3><div class="num">0</div><p>إدارة العملاء</p></div><div class="box"><h3>خدمة العملاء</h3><div class="num">0</div><p>الطلبات والاستفسارات</p></div><div class="box"><h3>المبيعات</h3><div class="num">0</div><p>عمليات البيع</p></div><div class="box"><h3>الموظفون</h3><div class="num">0</div><p>إدارة الموظفين</p></div><div class="box"><h3>التقارير</h3><div class="num">0</div><p>تقارير النظام</p></div></div></div></div><script>function doLogin(){var users={mh:"2002",mm:"1010",mp:"2020",nn:"5050"};var u=document.getElementById("username").value.trim();var p=document.getElementById("password").value;if(users[u]===p){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";document.getElementById("welcome").textContent="مرحبًا "+u}else{document.getElementById("error").textContent="اسم المستخدم أو رمز الدخول غير صحيح"}return false}function doLogout(){document.getElementById("app").style.display="none";document.getElementById("login").style.display="flex";document.getElementById("password").value=""}</script></body></html>
